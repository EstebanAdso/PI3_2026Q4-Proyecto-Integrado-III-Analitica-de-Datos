name: Ejecutar notebooks del proyecto

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ejecutar-notebooks-main
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Crear entorno virtual
        run: python -m venv .venv

      - name: Instalar dependencias
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Limpiar datos y reportes generados
        run: |
          mkdir -p src/actividad_1/datos src/actividad_1/reportes
          find src/actividad_1/datos -mindepth 1 -delete
          find src/actividad_1/reportes -mindepth 1 -delete
          mkdir -p AE2/resultados
          find AE2/resultados -mindepth 1 -delete

      - name: Ejecutar EA1_olist_comercial.ipynb
        working-directory: src/actividad_1
        run: |
          source ../../.venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            EA1_olist_comercial.ipynb

      - name: Ejecutar AE2_reconocimiento_olist.ipynb
        working-directory: AE2/notebooks
        run: |
          source ../../.venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            AE2_reconocimiento_olist.ipynb

      - name: Confirmar cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/actividad_1/datos src/actividad_1/reportes src/actividad_1/EA1_olist_comercial.ipynb
          git add AE2/resultados AE2/notebooks/AE2_reconocimiento_olist.ipynb

          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi

          git commit -m "chore: actualizar resultados de los notebooks [skip ci]"
          git push origin HEAD:main
